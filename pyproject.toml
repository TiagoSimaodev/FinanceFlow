[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financeflow"
version = "0.1.0"
description = "Aplicativo local de finanças pessoais e análise de dados"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-WTF>=1.2,<2.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<4.0",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financeflow = ["db/*.sql", "templates/*.html"]
